  <text x="42" y="27" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="-0.5" fill="#0f172a">ProdPlan</text>
